<title>אותיות היום</title>
<meta name="description" content="משחק מילים יומי: מצאו מילים בלוח אותיות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
:root {
  --ground: #E8ECF1;
  --paper: #FBFCFD;
  --ink: #15203A;
  --muted: #5A6680;
  --line: #C6CFDC;
  --cobalt: #1D47B3;
  --cobalt-ink: #FFFFFF;
  --cobalt-soft: #DCE4F7;
  --amber: #A86F06;
  --amber-fill: #E3A52B;
  --amber-soft: #F6EACB;
  --bad: #B3261E;
  --shadow: 0 1px 0 rgba(21, 32, 58, .08), 0 6px 14px -8px rgba(21, 32, 58, .35);
  --display: "Frank Ruhl Libre", "David Libre", "David", "Times New Roman", serif;
  --body: "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D1321;
    --paper: #182236;
    --ink: #E7ECF5;
    --muted: #93A0B9;
    --line: #2B3751;
    --cobalt: #7FA3FF;
    --cobalt-ink: #0D1321;
    --cobalt-soft: #1D2A4E;
    --amber: #F0B94D;
    --amber-fill: #F0B94D;
    --amber-soft: #382B12;
    --bad: #FF8A80;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 8px 18px -10px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0D1321;
  --paper: #182236;
  --ink: #E7ECF5;
  --muted: #93A0B9;
  --line: #2B3751;
  --cobalt: #7FA3FF;
  --cobalt-ink: #0D1321;
  --cobalt-soft: #1D2A4E;
  --amber: #F0B94D;
  --amber-fill: #F0B94D;
  --amber-soft: #382B12;
  --bad: #FF8A80;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 8px 18px -10px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 48px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

.app {
  max-width: 980px;
  margin-inline: auto;
  display: grid;
  gap: 28px;
}
@media (min-width: 860px) {
  .app { grid-template-columns: 440px 1fr; align-items: start; column-gap: 48px; }
  .masthead { grid-column: 1 / -1; }
  .words { padding-top: 4px; }
}

/* ---------- masthead ---------- */
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 12px 24px;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 12px;
}
.brand h1 {
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(2.2rem, 7vw, 3.1rem);
  line-height: 1;
  margin: 0;
  letter-spacing: -.01em;
}
.brand p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
.daynav { display: flex; align-items: center; gap: 6px; }
.daynav .when { min-width: 9.5em; text-align: center; font-weight: 600; }
.daynav .when small { display: block; color: var(--muted); font-weight: 400; font-size: .8rem; }
.iconbtn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--paper);
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 1.1rem;
}
.iconbtn:disabled { opacity: .35; cursor: default; }

/* ---------- board column ---------- */
.play { display: grid; gap: 16px; }
.status { display: grid; gap: 8px; }
.status .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rank { font-family: var(--display); font-weight: 700; font-size: 1.35rem; }
.nums { color: var(--muted); font-variant-numeric: tabular-nums; }
.nums b { color: var(--ink); }
.meter { height: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--cobalt); border-radius: 99px; transition: width .4s ease; }

.current {
  height: 2.6rem;
  margin-top: -4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-weight: 700;
  font-size: 2rem; letter-spacing: .04em;
}
.toast {
  min-height: 1.6rem;
  text-align: center;
  font-weight: 600;
  margin-top: -10px;
  transition: opacity .3s;
}
.toast.main { color: var(--cobalt); }
.toast.bonus { color: var(--amber); }
.toast.bad { color: var(--bad); }
.toast.info { color: var(--muted); }

.board {
  position: relative;
  width: 100%;
  max-width: 440px;
  aspect-ratio: 1;
  margin-inline: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.tiles {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: repeat(var(--n, 5), 1fr);
  gap: calc(16% / var(--n, 5));
}
.tile {
  position: relative;
  border: 0;
  border-radius: 10%;
  background: var(--paper);
  box-shadow: var(--shadow), inset 0 0 0 1.5px var(--line);
  cursor: pointer;
  display: grid; place-items: center;
  font-family: var(--display);
  font-weight: 900;
  font-size: calc(clamp(1.6rem, 8.5vw, 2.6rem) * 5 / var(--n, 5));
  line-height: 1;
  color: var(--cobalt);
  padding: 0;
  transition: transform .12s ease, background .12s ease, color .12s ease;
}
/* the ceramic frame */
.tile::before {
  content: "";
  position: absolute; inset: 9%;
  border: 1.5px solid var(--cobalt);
  border-radius: 8%;
  opacity: .28;
  pointer-events: none;
}
.tile.on { background: var(--cobalt); color: var(--cobalt-ink); transform: scale(.94); }
.tile.on::before { border-color: var(--cobalt-ink); opacity: .4; }
.tile.show { background: var(--cobalt-soft); }
.tile.show.bonus { background: var(--amber-soft); }
.tile.hint { animation: pulse 1.2s ease 2; }
@keyframes pulse { 50% { background: var(--amber-soft); transform: scale(1.06); } }
.trace { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.trace polyline { fill: none; stroke: var(--cobalt); stroke-opacity: .35; stroke-linecap: round; stroke-linejoin: round; }

.typing { display: flex; gap: 8px; }
.typing input {
  flex: 1; min-width: 0;
  font: inherit; font-size: 1.05rem;
  padding: 10px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
}
.btn {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--paper);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.help { color: var(--muted); font-size: .9rem; text-align: center; margin: 0; text-wrap: balance; }

/* ---------- words column ---------- */
.words { display: grid; gap: 26px; }
.words h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.4rem;
  margin: 0 0 4px;
  display: flex; align-items: baseline; gap: 10px;
}
.words h2 small { font-family: var(--body); font-size: .9rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.group { display: grid; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.group .label { font-size: .85rem; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 0;
  border-radius: 8px;
  padding: 3px 10px;
  font-size: 1.02rem;
  font-weight: 600;
  background: var(--cobalt-soft);
  color: var(--ink);
  cursor: pointer;
}
.chip.bonus { background: var(--amber-soft); }
.chip.missed { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); font-weight: 400; }
.chip.fresh { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.slots { color: var(--muted); font-size: .92rem; }
.empty { color: var(--muted); margin: 0; }
.legend { color: var(--muted); font-size: .9rem; margin: 0; max-width: 60ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

  </section>

  <section class="words" aria-label="מילים שנמצאו">

      <h2>בונוס <small id="bonusCount"></small></h2>

      <div class="group"><div class="chips" id="bonusChips"></div></div>
    </div>
  </section>
</div>

const EPOCH = "2026-09-01";

let SIZE = 5, N = 25, NEIGH = [];   // set per board by setSize()
const MIN_LEN = 4;
const TO_REGULAR = { "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" };
const TO_FINAL = { "כ": "ך", "מ": "ם", "נ": "ן", "פ": "ף", "צ": "ץ" };
const POINTS = { 4: 1, 5: 2, 6: 3, 7: 5 };
const RANKS = [[0, "מתחילים"], [.1, "בדרך"], [.25, "יפה"], [.45, "טוב מאוד"], [.65, "מצוין"], [.85, "מדהים"], [1, "גאון"]];

const norm = w => [...w].filter(c => c >= "א" && c <= "ת").map(c => TO_REGULAR[c] || c).join("");
const withFinal = s => s.length ? s.slice(0, -1) + (TO_FINAL[s.at(-1)] || s.at(-1)) : s;
const points = (w, cat) => (POINTS[norm(w).length] || 11) * (cat === "bonus" ? 2 : 1);

function setSize(size) {
  SIZE = size; N = size * size;
  NEIGH = Array.from({ length: N }, (_, i) => {
    const r = Math.floor(i / SIZE), c = i % SIZE, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = r + dr, cc = c + dc;
      if ((dr || dc) && rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE) out.push(rr * SIZE + cc);
    }
    return out;
  });
  document.documentElement.style.setProperty("--n", size);
}

// ---------- dates ----------
const DATES = Object.keys(BOARDS).sort();
function todayInIsrael() {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jerusalem" }).format(new Date());
  } catch (e) { return new Date().toISOString().slice(0, 10); }
}
const TODAY = todayInIsrael();
const PLAYABLE = DATES.filter(d => d <= TODAY);
if (!PLAYABLE.length) PLAYABLE.push(DATES[0]);
const dayNumber = d => Math.round((Date.parse(d) - Date.parse(EPOCH)) / 864e5) + 1;
function prettyDate(d) {
  try {
    return new Intl.DateTimeFormat("he-IL", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" })
      .format(new Date(d + "T12:00:00Z"));
  } catch (e) { return d; }
}

// ---------- storage (optional; the game works without it) ----------
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- state ----------
const S = {
  date: null, letters: [], rot: 0,
  main: new Map(), bonus: new Map(),      // normalized -> word
  found: [],                               // [{w, cat}]
  revealed: false, hints: 0,
  path: [], dragging: false, moved: false,
};
const $ = id => document.getElementById(id);

function rotateGrid(letters, times) {
  let g = letters.slice();
  for (let t = 0; t < times; t++) {
    const n = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) n.push(g[(SIZE - 1 - c) * SIZE + r]);
    g = n;
  }
  return g;
}

function loadDay(date) {
  const b = BOARDS[date];
  S.date = date;
  S.base = [...b.g];
  setSize(Math.round(Math.sqrt(S.base.length)));
  S.main = new Map(b.m.split(" ").map(w => [norm(w), w]));
  S.bonus = new Map(b.b ? b.b.split(" ").map(w => [norm(w), w]) : []);
  const saved = store.get("otiot:" + date) || {};
  S.found = (saved.found || []).filter(f => S.main.has(norm(f.w)) || S.bonus.has(norm(f.w)));
  S.revealed = !!saved.revealed;
  S.hints = saved.hints || 0;
  S.rot = saved.rot || 0;
  S.letters = rotateGrid(S.base, S.rot);
  S.path = [];
  S.fresh = null;
  $("toast").textContent = "";
  $("reveal").textContent = "הצגת כל המילים";
  $("reveal").classList.remove("danger");
  renderTiles();
  renderAll();
}
function save() {
  store.set("otiot:" + S.date, { found: S.found, revealed: S.revealed, hints: S.hints, rot: S.rot });
}

// ---------- rendering ----------
function renderTiles() {
  const box = $("tiles");
  box.innerHTML = "";
  S.letters.forEach((ch, i) => {
    const t = document.createElement("button");
    t.type = "button";
    t.className = "tile";
    t.textContent = ch;
    t.dataset.i = i;
    t.setAttribute("aria-label", "האות " + ch);
    box.appendChild(t);
  });
  renderPath();
}

function renderPath() {
  const tiles = $("tiles").children;
  for (const t of tiles) t.classList.toggle("on", S.path.includes(+t.dataset.i));
  const word = S.path.map(i => S.letters[i]).join("");
  $("current").textContent = withFinal(word);
  const rect = $("board").getBoundingClientRect();
  $("trace").setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
  const pts = S.path.map(i => {
    const r = tiles[i].getBoundingClientRect();
    return `${r.left - rect.left + r.width / 2},${r.top - rect.top + r.height / 2}`;
  });
  $("line").setAttribute("points", pts.join(" "));
  $("line").setAttribute("stroke-width", rect.width / 16);
}

function renderAll() {
  const i = PLAYABLE.indexOf(S.date);
  $("prev").disabled = i <= 0;
  $("next").disabled = i >= PLAYABLE.length - 1;
  $("when").innerHTML = `${S.date === TODAY ? "היום" : prettyDate(S.date)}<small>לוח מס׳ ${dayNumber(S.date)}${S.date === TODAY ? " · " + prettyDate(S.date) : ""}</small>`;

  const total = S.main.size;
  const mainFound = S.found.filter(f => f.cat === "main");
  const bonusFound = S.found.filter(f => f.cat === "bonus");
  const score = S.found.reduce((s, f) => s + points(f.w, f.cat), 0);
  const frac = mainFound.length / total;
  let rank = RANKS[0][1];
  for (const [t, name] of RANKS) if (frac >= t) rank = name;
  $("rank").textContent = rank;
  $("nums").innerHTML = `<b>${mainFound.length}</b> מתוך ${total} · <b>${score}</b> נק׳`;
  $("meter").style.width = (100 * frac) + "%";

  // main words grouped by length, with remaining counts
  const byLen = new Map();
  for (const w of S.main.values()) {
    const L = Math.min(norm(w).length, 8);
    if (!byLen.has(L)) byLen.set(L, { all: [], found: [] });
    byLen.get(L).all.push(w);
  }
  const foundSet = new Set(S.found.map(f => f.w));
  const groups = $("mainGroups");
  groups.innerHTML = "";
  [...byLen.keys()].sort((a, b) => a - b).forEach(L => {
    const g = byLen.get(L);
    const got = g.all.filter(w => foundSet.has(w));
    const div = document.createElement("div");
    div.className = "group";
    const label = L >= 8 ? "8 אותיות ומעלה" : `${L} אותיות`;
    div.innerHTML = `<div class="label">${label} · ${got.length}/${g.all.length}</div>`;
    const chips = document.createElement("div");
    chips.className = "chips";
    const order = S.found.map(f => f.w);
    got.sort((a, b) => order.indexOf(a) - order.indexOf(b)).forEach(w => chips.appendChild(chip(w, "main")));
    if (S.revealed) g.all.filter(w => !foundSet.has(w)).sort().forEach(w => chips.appendChild(chip(w, "missed")));
    else if (got.length < g.all.length) {
      const s = document.createElement("span");
      s.className = "slots";
      const left = g.all.length - got.length;
      s.textContent = left === 1 ? "עוד מילה אחת" : `עוד ${left}`;
      chips.appendChild(s);
    }
    div.appendChild(chips);
    groups.appendChild(div);
  });
  $("mainCount").textContent = `${mainFound.length}/${total}`;

  const bc = $("bonusChips");
  bc.innerHTML = "";
  bonusFound.forEach(f => bc.appendChild(chip(f.w, "bonus")));
  if (!bonusFound.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "עדיין לא נמצאו. יש בלוח הזה " + S.bonus.size + ".";
    bc.appendChild(p);
  }
  $("bonusCount").textContent = `${bonusFound.length} מתוך ${S.bonus.size}`;
}

function chip(w, kind) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (kind === "main" ? "" : " " + kind) + (w === S.fresh ? " fresh" : "");
  b.textContent = w;
  b.title = "הצגה על הלוח";
  b.addEventListener("click", () => showWord(w, kind === "bonus"));
  return b;
}

// ---------- word logic ----------
function findPath(word) {
  const w = norm(word), L = S.letters;
  const go = (k, cell, used) => {
    if (k === w.length) return used;
    for (const n of NEIGH[cell]) if (L[n] === w[k] && !used.includes(n)) {
      const r = go(k + 1, n, [...used, n]);
      if (r) return r;
    }
    return null;
  };
  for (let s = 0; s < N; s++) if (L[s] === w[0]) { const r = go(1, s, [s]); if (r) return r; }
  return null;
}

let flashTimer;
function showWord(w, bonus) {
  const p = findPath(w) || [];
  clearTimeout(flashTimer);
  const tiles = $("tiles").children;
  for (const t of tiles) t.classList.remove("show", "bonus");
  p.forEach(i => { tiles[i].classList.add("show"); if (bonus) tiles[i].classList.add("bonus"); });
  flashTimer = setTimeout(() => { for (const t of tiles) t.classList.remove("show", "bonus"); }, 1600);
}

let toastTimer;
function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast " + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.textContent = ""; }, 2600);
}

function submit(key) {
  if (key.length < MIN_LEN) { if (key.length > 1) toast("צריך לפחות 4 אותיות", "info"); return; }
  const w = S.main.get(key) || S.bonus.get(key);
  if (!w) { toast(`${withFinal(key)} לא ברשימה`, "bad"); return; }
  if (S.found.some(f => f.w === w)) { toast(`${w} כבר נמצאה`, "info"); showWord(w); return; }
  const cat = S.main.has(key) ? "main" : "bonus";
  S.found.push({ w, cat });
  S.fresh = w;
  const pts = points(w, cat);
  const done = cat === "main" && S.found.filter(f => f.cat === "main").length === S.main.size;
  if (done) toast(`${w}! סיימתם את כל המילים 🎉`, "main");
  else if (cat === "bonus") toast(`בונוס! ${w} · ${pts} נק׳`, "bonus");
  else toast(pts === 1 ? `${w} · נקודה` : `${w} · ${pts} נק׳`, "main");
  save();
  renderAll();
}

// ---------- pointer input: drag, or tap letter by letter ----------
const board = $("board");
let rects = [];
function tileAt(x, y) {
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(x - cx, y - cy) < r.width * 0.45) return i;
  }
  return -1;
}
function extend(i) {
  const p = S.path;
  if (i < 0) return false;
  if (p.length >= 2 && i === p[p.length - 2]) { p.pop(); return true; }      // back up
  if (!p.includes(i) && (!p.length || NEIGH[p[p.length - 1]].includes(i))) { p.push(i); return true; }
  return false;
}
function finish() {
  const key = S.path.map(i => S.letters[i]).join("");
  S.path = [];
  renderPath();
  submit(key);
}

board.addEventListener("pointerdown", e => {
  rects = [...$("tiles").children].map(t => t.getBoundingClientRect());
  const i = tileAt(e.clientX, e.clientY);
  if (i < 0) return;
  e.preventDefault();
  board.setPointerCapture(e.pointerId);
  const p = S.path;
  S.tappedLast = p.length > 0 && i === p[p.length - 1];
  if (!S.tappedLast && !(p.length && NEIGH[p[p.length - 1]].includes(i) && !p.includes(i))) S.path = [];
  if (!S.tappedLast) extend(i);
  S.dragging = true;
  S.moved = false;
  renderPath();
});
board.addEventListener("pointermove", e => {
  if (!S.dragging) return;
  if (extend(tileAt(e.clientX, e.clientY))) { S.moved = true; renderPath(); }
});
function endDrag() {
  if (!S.dragging) return;
  S.dragging = false;
  if (S.moved || S.tappedLast) finish();      // a drag, or a tap on the last letter, sends the word
}
board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", () => { S.dragging = false; S.path = []; renderPath(); });

// keyboard on tiles: Enter/Space adds a letter (or sends when it's the last one)
$("tiles").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const i = +e.target.dataset.i;
  if (Number.isNaN(i)) return;
  e.preventDefault();
  const p = S.path;
  if (p.length && p[p.length - 1] === i) { finish(); return; }
  if (!extend(i)) S.path = [i];
  renderPath();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { S.path = []; renderPath(); }
});

$("typeform").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("typed").value;
  $("typed").value = "";
  submit(norm(v));
});

// ---------- tools ----------
$("hint").addEventListener("click", () => {
  const missing = [...S.main.values()].filter(w => !S.found.some(f => f.w === w));
  if (!missing.length) { toast("מצאתם הכול, אין צורך ברמזים", "info"); return; }
  const w = missing[(S.hints * 7 + 3) % missing.length];
  const p = findPath(w);
  S.hints++;
  save();
  toast(`מילה של ${norm(w).length} אותיות שמתחילה ב־${w[0]}`, "info");
  const t = $("tiles").children[p[0]];
  t.classList.remove("hint"); void t.offsetWidth; t.classList.add("hint");
});
$("rotate").addEventListener("click", () => {
  S.rot = (S.rot + 1) % 4;
  S.letters = rotateGrid(S.base, S.rot);
  S.path = [];
  save();
  renderTiles();
});
let revealArmed = false;
$("reveal").addEventListener("click", () => {
  if (S.revealed) return;
  if (!revealArmed) {
    revealArmed = true;
    $("reveal").textContent = "בטוחים? להקיש שוב";
    $("reveal").classList.add("danger");
    setTimeout(() => {
      revealArmed = false;
      if (!S.revealed) { $("reveal").textContent = "הצגת כל המילים"; $("reveal").classList.remove("danger"); }
    }, 3000);
    return;
  }
  S.revealed = true;
  $("reveal").textContent = "כל המילים מוצגות";
  $("reveal").classList.remove("danger");
  save();
  renderAll();
});

$("prev").addEventListener("click", () => {
  const i = PLAYABLE.indexOf(S.date);
  if (i > 0) loadDay(PLAYABLE[i - 1]);
});
$("next").addEventListener("click", () => {
  const i = PLAYABLE.indexOf(S.date);
  if (i < PLAYABLE.length - 1) loadDay(PLAYABLE[i + 1]);
});
window.addEventListener("resize", renderPath);

function start(data) {
  const d = data && data.date && PLAYABLE.includes(data.date) ? data.date : PLAYABLE[PLAYABLE.length - 1];
  loadDay(d);
}
window.claude?.hot?.snapshot?.(() => ({ date: S.date }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
