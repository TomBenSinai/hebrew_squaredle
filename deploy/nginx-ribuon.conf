# ribuon.com on an nginx that already serves another site.
#
# Append to that nginx's config (a file under conf.d) and reload. Two passes,
# because the certificate cannot exist before the challenge can be answered:
#
#   1. Add the `listen 80` block only, reload, then issue the certificate with
#      certbot's webroot at /var/www/certbot.
#   2. Add the two `listen 443` blocks, reload again.
#
# docs/DEPLOY.md has the full sequence with the commands.

server {
    listen 80;
    listen [::]:80;
    server_name ribuon.com www.ribuon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ribuon.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ribuon.com;

    ssl_certificate     /etc/letsencrypt/live/ribuon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ribuon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ribuon.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ribuon.com;

    ssl_certificate     /etc/letsencrypt/live/ribuon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ribuon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Docker's embedded DNS, re-resolved, so recreating the container does not
    # leave nginx proxying to a stale address. Caddy inside rivuon-web serves
    # the site and the API; caching and the rest of the headers come from there.
    resolver 127.0.0.11 valid=30s;
    set $rivuon http://rivuon-web:80;

    location / {
        proxy_pass $rivuon;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
