# Dev stack: `docker compose up --build`, then open http://localhost:5174
# Host ports: RIBUON_WEB_PORT (5174), RIBUON_API_PORT (8001).
services:
  backend:
    build: ./backend
    volumes:
      - ./:/repo                      # wordgame.py, boards/, shapes.json, backend code (live reload)
      - backend-data:/data
    environment:
      RIBUON_DB: /data/ribuon.db
      # RIBUON_TODAY: "2026-09-25"    # pretend it's another day
      # Login: without RIBUON_SMTP_HOST, email links are only printed to this container's log.
      # For Google or real mail, set these in .env (see docs/DEPLOY.md, "Testing login locally").
      RIBUON_PUBLIC_URL: http://localhost:${RIBUON_WEB_PORT:-5174}
      RIBUON_MAIL_TO_LOG: "1"
      RIBUON_GOOGLE_CLIENT_ID: ${RIBUON_GOOGLE_CLIENT_ID:-}
      RIBUON_GOOGLE_CLIENT_SECRET: ${RIBUON_GOOGLE_CLIENT_SECRET:-}
      RIBUON_SMTP_HOST: ${RIBUON_SMTP_HOST:-}
      RIBUON_SMTP_PORT: ${RIBUON_SMTP_PORT:-}
      RIBUON_SMTP_USER: ${RIBUON_SMTP_USER:-}
      RIBUON_SMTP_PASSWORD: ${RIBUON_SMTP_PASSWORD:-}
      RIBUON_MAIL_FROM: ${RIBUON_MAIL_FROM:-}
      RIBUON_MAIL_REPLY_TO: ${RIBUON_MAIL_REPLY_TO:-}
    ports:
      - "127.0.0.1:${RIBUON_API_PORT:-8001}:8000"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules             # keep the container's own node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "${RIBUON_WEB_PORT:-5174}:5173"
    depends_on:
      - backend

volumes:
  backend-data:
