# ריבועון on a machine where another stack already owns ports 80 and 443
# (see docs/DEPLOY.md, "Sharing a server with another site").
#
#   docker compose -f docker-compose.behind-proxy.yml up -d --build
#
# Nothing here is published to the host: the existing proxy reaches `ribuon-web`
# by name over the shared Docker network named in RIBUON_PROXY_NETWORK, and
# terminates TLS itself. Inside, the layout is identical to the standalone
# stack - Caddy serves the built site and proxies /api to uvicorn, one origin.
name: ribuon                          # the volume and image names, whatever the folder is called

services:
  api:
    container_name: ribuon-api
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./:/repo:ro                   # wordgame.py, boards/, shapes.json, backend code
      - ribuon-db:/data               # ribuon.db, the players' progress
    environment:
      RIBUON_DB: /data/ribuon.db
      # Optional login (docs/DEPLOY.md, "Login"): set these in .env. Left empty,
      # each way to log in stays off and the game plays as before.
      RIBUON_PUBLIC_URL: https://${RIBUON_DOMAIN:-ribuon.com}
      RIBUON_GOOGLE_CLIENT_ID: ${RIBUON_GOOGLE_CLIENT_ID:-}
      RIBUON_GOOGLE_CLIENT_SECRET: ${RIBUON_GOOGLE_CLIENT_SECRET:-}
      RIBUON_SMTP_HOST: ${RIBUON_SMTP_HOST:-}
      RIBUON_SMTP_PORT: ${RIBUON_SMTP_PORT:-}
      RIBUON_SMTP_USER: ${RIBUON_SMTP_USER:-}
      RIBUON_SMTP_PASSWORD: ${RIBUON_SMTP_PASSWORD:-}
      RIBUON_MAIL_FROM: ${RIBUON_MAIL_FROM:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    container_name: ribuon-web
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./deploy/Caddyfile.internal:/etc/caddy/Caddyfile:ro
    networks:
      - default                       # to reach api
      - proxy                         # so the front proxy can reach this

networks:
  proxy:
    external: true
    name: ${RIBUON_PROXY_NETWORK:?set RIBUON_PROXY_NETWORK in .env to the front proxy's Docker network}

volumes:
  ribuon-db:
