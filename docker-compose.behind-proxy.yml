# ריבועון on a machine where another stack already owns ports 80 and 443
# (see docs/DEPLOY.md, "Sharing a server with another site").
#
#   docker compose -f docker-compose.behind-proxy.yml up -d --build
#
# Nothing here is published to the host: the existing proxy reaches `rivuon-web`
# by name over the shared Docker network named in RIVUON_PROXY_NETWORK, and
# terminates TLS itself. Inside, the layout is identical to the standalone
# stack - Caddy serves the built site and proxies /api to uvicorn, one origin.
services:
  api:
    container_name: rivuon-api
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./:/repo:ro                   # wordgame.py, boards/, shapes.json, backend code
      - rivuon-db:/data               # rivuon.db, the players' progress
    environment:
      RIVUON_DB: /data/rivuon.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    container_name: rivuon-web
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./deploy/Caddyfile.internal:/etc/caddy/Caddyfile:ro
    networks:
      - default                       # to reach api
      - proxy                         # so the front proxy can reach this

networks:
  proxy:
    external: true
    name: ${RIVUON_PROXY_NETWORK:?set RIVUON_PROXY_NETWORK in .env to the front proxy's Docker network}

volumes:
  rivuon-db:
